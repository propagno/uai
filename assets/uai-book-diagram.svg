<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="UAI - Unidade de Analise Inteligente - diagrama executivo e educativo">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7f2e9"/>
      <stop offset="52%" stop-color="#f2eee7"/>
      <stop offset="100%" stop-color="#e8eff6"/>
    </linearGradient>
    <linearGradient id="layerBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d9e8f4"/>
      <stop offset="100%" stop-color="#eef4fa"/>
    </linearGradient>
    <linearGradient id="layerGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dfe9c4"/>
      <stop offset="100%" stop-color="#eef4dd"/>
    </linearGradient>
    <linearGradient id="cardBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2f5f83"/>
      <stop offset="100%" stop-color="#213f59"/>
    </linearGradient>
    <linearGradient id="cardSoft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffdfa"/>
      <stop offset="100%" stop-color="#f3ede4"/>
    </linearGradient>
    <linearGradient id="cardSupport" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff5dc"/>
      <stop offset="100%" stop-color="#dbe7b8"/>
    </linearGradient>
    <linearGradient id="cardGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8a93f"/>
      <stop offset="100%" stop-color="#b88220"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f1720" flood-opacity="0.15"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#111827" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3c688a"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b98927"/>
    </marker>
    <style>
      .title { font-family: Georgia, "Times New Roman", serif; fill: #171411; }
      .subtitle { font-family: Georgia, "Times New Roman", serif; fill: #2f2a23; font-style: italic; }
      .bandTitle { font-family: "Avenir Next", "Segoe UI", sans-serif; font-weight: 800; fill: #ffffff; letter-spacing: 0.01em; }
      .note { font-family: "Avenir Next", "Segoe UI", sans-serif; font-weight: 700; fill: #a57d25; }
      .cardTitleDark { font-family: "Avenir Next", "Segoe UI", sans-serif; font-weight: 800; fill: #f7fbff; letter-spacing: 0.01em; }
      .cardBodyDark { font-family: "Avenir Next", "Segoe UI", sans-serif; fill: #e8f1f7; }
      .cardTitleSoft { font-family: "Avenir Next", "Segoe UI", sans-serif; font-weight: 800; fill: #151515; letter-spacing: 0.01em; }
      .cardBodySoft { font-family: "Avenir Next", "Segoe UI", sans-serif; fill: #2f2c28; }
      .legend { font-family: "Avenir Next", "Segoe UI", sans-serif; fill: #303030; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <text x="22" y="58" class="title" font-size="58">UAI - Unidade de Analise Inteligente</text>
  <text x="22" y="104" class="subtitle" font-size="29">Motor de descoberta, analise funcional, evidencia e modernizacao para sistemas legados</text>

  <rect x="8" y="150" width="1584" height="198" rx="30" fill="url(#layerBlue)" stroke="#d1dae4" stroke-width="2" filter="url(#shadow)"/>
  <rect x="8" y="376" width="1584" height="206" rx="30" fill="url(#layerBlue)" stroke="#d1dae4" stroke-width="2" filter="url(#shadow)"/>
  <rect x="8" y="606" width="1584" height="232" rx="30" fill="url(#layerGreen)" stroke="#d5ddc5" stroke-width="2" filter="url(#shadow)"/>

  <rect x="28" y="170" width="620" height="38" rx="14" fill="#5a85a7"/>
  <text x="46" y="196" class="bandTitle" font-size="20">CAMADA 1: DESCOBERTA E ESTRUTURACAO DO LEGADO</text>

  <rect x="28" y="394" width="520" height="38" rx="14" fill="#5a85a7"/>
  <text x="46" y="420" class="bandTitle" font-size="20">CAMADA 2: ANALISE FUNCIONAL E EVIDENCIA</text>

  <rect x="28" y="624" width="690" height="38" rx="14" fill="#90aa4d"/>
  <text x="46" y="650" class="bandTitle" font-size="20">CAMADA 3: MODERNIZACAO, TRANSICAO E GOVERNANCA</text>

  <text x="670" y="190" class="note" font-size="17">COBERTURA, CONFIANCA E QUALIDADE DO MODELO</text>
  <path d="M 657 196 H 1500 V 258" stroke="#b98927" stroke-width="4" stroke-dasharray="12 10" fill="none"/>

  <g filter="url(#softShadow)">
    <rect x="44" y="222" width="300" height="96" rx="18" fill="url(#cardBlue)"/>
    <rect x="368" y="222" width="260" height="96" rx="18" fill="url(#cardBlue)"/>
    <rect x="688" y="222" width="260" height="96" rx="18" fill="url(#cardBlue)"/>
    <rect x="1026" y="214" width="482" height="110" rx="22" fill="url(#cardSoft)"/>
  </g>

  <text x="74" y="258" class="cardTitleDark" font-size="24">STATE + manifest</text>
  <text x="74" y="286" class="cardBodyDark" font-size="18">Escopo, fontes, aliases,</text>
  <text x="74" y="310" class="cardBodyDark" font-size="18">contexto e ponto de partida</text>

  <text x="437" y="258" class="cardTitleDark" font-size="24">INGEST</text>
  <text x="399" y="286" class="cardBodyDark" font-size="18">Inventario, classificacao,</text>
  <text x="399" y="310" class="cardBodyDark" font-size="18">parsers e extracao bruta</text>

  <text x="771" y="258" class="cardTitleDark" font-size="24">MODEL</text>
  <text x="719" y="286" class="cardBodyDark" font-size="18">Entidades, relacoes,</text>
  <text x="719" y="310" class="cardBodyDark" font-size="18">contratos e normalizacao</text>

  <text x="1062" y="258" class="cardTitleSoft" font-size="24">MAP + VERIFY</text>
  <text x="1062" y="286" class="cardBodySoft" font-size="18">Call graph, batch flow, lineage,</text>
  <text x="1062" y="310" class="cardBodySoft" font-size="18">cobertura, confianca e lacunas</text>

  <path d="M 344 270 H 368" stroke="#3c688a" stroke-width="6" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M 628 270 H 688" stroke="#3c688a" stroke-width="6" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M 948 270 H 1026" stroke="#3c688a" stroke-width="6" fill="none" marker-end="url(#arrowBlue)"/>

  <g filter="url(#softShadow)">
    <rect x="70" y="446" width="270" height="104" rx="18" fill="url(#cardBlue)"/>
    <rect x="376" y="446" width="300" height="104" rx="18" fill="url(#cardBlue)"/>
    <rect x="702" y="436" width="312" height="124" rx="18" fill="url(#cardBlue)"/>
    <rect x="1052" y="434" width="306" height="122" rx="18" fill="url(#cardSoft)"/>
    <rect x="1404" y="452" width="154" height="88" rx="18" fill="url(#cardBlue)"/>
  </g>

  <text x="104" y="480" class="cardTitleDark" font-size="22">EXECUTIVE</text>
  <text x="104" y="509" class="cardBodyDark" font-size="17">Visao macro, recortes</text>
  <text x="104" y="531" class="cardBodyDark" font-size="17">e leitura executiva</text>

  <text x="410" y="480" class="cardTitleDark" font-size="20">SEARCH / IMPACT / LINEAGE</text>
  <text x="410" y="509" class="cardBodyDark" font-size="17">Busca profunda, impacto</text>
  <text x="410" y="531" class="cardBodyDark" font-size="17">e rastreio de dados</text>

  <text x="736" y="476" class="cardTitleDark" font-size="24">ANALYZE</text>
  <text x="736" y="506" class="cardBodyDark" font-size="17">Resolucao do seed, fases</text>
  <text x="736" y="528" class="cardBodyDark" font-size="17">semanticas, claims, citations</text>
  <text x="736" y="550" class="cardBodyDark" font-size="17">e quality gate funcional</text>

  <text x="1088" y="474" class="cardTitleSoft" font-size="22">DOSSIER PACKAGE</text>
  <text x="1088" y="503" class="cardBodySoft" font-size="17">dossier-tech, dossier-business,</text>
  <text x="1088" y="525" class="cardBodySoft" font-size="17">reverse-trace, evidence,</text>
  <text x="1088" y="547" class="cardBodySoft" font-size="17">traceability e diagrams</text>

  <text x="1436" y="486" class="cardTitleDark" font-size="20">DOC / EXPORT</text>
  <text x="1436" y="512" class="cardBodyDark" font-size="16">Markdown, DSL,</text>
  <text x="1436" y="532" class="cardBodyDark" font-size="16">CSV, GraphML</text>

  <path d="M 190 318 V 380 V 446" stroke="#3c688a" stroke-width="5" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M 818 318 V 434" stroke="#3c688a" stroke-width="5" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M 340 498 H 376" stroke="#3c688a" stroke-width="5" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M 676 498 H 702" stroke="#3c688a" stroke-width="5" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M 1014 498 H 1052" stroke="#3c688a" stroke-width="5" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M 1358 498 H 1404" stroke="#3c688a" stroke-width="5" fill="none" marker-end="url(#arrowBlue)"/>

  <text x="1108" y="582" class="note" font-size="15">FEEDBACK PARA PRIORIDADES, RISCO E REFINO DO FRAMEWORK</text>

  <g filter="url(#softShadow)">
    <rect x="42" y="690" width="246" height="92" rx="18" fill="url(#cardBlue)"/>
    <rect x="326" y="690" width="308" height="92" rx="18" fill="url(#cardBlue)"/>
    <rect x="674" y="680" width="344" height="112" rx="18" fill="url(#cardBlue)"/>
    <rect x="1060" y="690" width="246" height="92" rx="18" fill="url(#cardBlue)"/>
    <rect x="1330" y="654" width="228" height="162" rx="22" fill="url(#cardGold)"/>
  </g>

  <text x="74" y="724" class="cardTitleDark" font-size="22">MODERNIZE</text>
  <text x="74" y="752" class="cardBodyDark" font-size="17">Blueprint Azure + Java</text>
  <text x="74" y="774" class="cardBodyDark" font-size="17">a partir do dossie legado</text>

  <text x="358" y="724" class="cardTitleDark" font-size="22">SERVICE CANDIDATES</text>
  <text x="358" y="752" class="cardBodyDark" font-size="17">Bounded contexts, APIs, eventos,</text>
  <text x="358" y="774" class="cardBodyDark" font-size="17">ownership e recursos Azure</text>

  <text x="708" y="724" class="cardTitleDark" font-size="22">MIGRATION WAVES + CUTOVER</text>
  <text x="708" y="752" class="cardBodyDark" font-size="17">Ondas, backlog, checkpoints,</text>
  <text x="708" y="774" class="cardBodyDark" font-size="17">coexistencia e strangler</text>

  <text x="1090" y="724" class="cardTitleDark" font-size="22">MODERNIZE-VERIFY</text>
  <text x="1090" y="752" class="cardBodyDark" font-size="17">Aderencia do alvo, drift</text>
  <text x="1090" y="774" class="cardBodyDark" font-size="17">e validacao da transicao</text>

  <text x="1366" y="698" class="cardTitleDark" font-size="22">SAIDA PARA OXE</text>
  <text x="1366" y="730" class="cardBodyDark" font-size="17">SPEC, PLAN, ROADMAP</text>
  <text x="1366" y="754" class="cardBodyDark" font-size="17">e checkpoints alimentados</text>
  <text x="1366" y="778" class="cardBodyDark" font-size="17">por evidencia UAI rastreavel</text>

  <path d="M 190 662 V 690" stroke="#3c688a" stroke-width="5" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M 488 662 V 690" stroke="#3c688a" stroke-width="5" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M 858 560 V 680" stroke="#3c688a" stroke-width="5" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M 288 736 H 326" stroke="#3c688a" stroke-width="5" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M 634 736 H 674" stroke="#3c688a" stroke-width="5" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M 1018 736 H 1060" stroke="#3c688a" stroke-width="5" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M 1306 736 H 1330" stroke="#b98927" stroke-width="5" fill="none" marker-end="url(#arrowGold)"/>
  <path d="M 1280 560 V 626 H 1540 V 856 H 1462" stroke="#b98927" stroke-width="5" fill="none" marker-end="url(#arrowGold)"/>

  <g filter="url(#softShadow)">
    <rect x="38" y="786" width="248" height="46" rx="16" fill="url(#cardSupport)"/>
    <rect x="306" y="786" width="190" height="46" rx="16" fill="url(#cardSupport)"/>
    <rect x="528" y="786" width="214" height="46" rx="16" fill="url(#cardSupport)"/>
    <rect x="778" y="786" width="228" height="46" rx="16" fill="url(#cardSupport)"/>
  </g>

  <text x="62" y="814" class="cardTitleSoft" font-size="17">codebase/* + source map</text>
  <text x="62" y="832" class="cardBodySoft" font-size="14">Base tecnica observada</text>

  <text x="330" y="814" class="cardTitleSoft" font-size="17">review / obs / diff</text>
  <text x="330" y="832" class="cardBodySoft" font-size="14">Aprendizado e calibracao</text>

  <text x="552" y="814" class="cardTitleSoft" font-size="17">commands / skills</text>
  <text x="552" y="832" class="cardBodySoft" font-size="14">Operacao guiada por spec</text>

  <text x="802" y="814" class="cardTitleSoft" font-size="17">doc / export / serve</text>
  <text x="802" y="832" class="cardBodySoft" font-size="14">Distribuicao e leitura</text>

  <g filter="url(#softShadow)">
    <rect x="30" y="848" width="760" height="36" rx="12" fill="#ffffff" stroke="#d9d4ca" stroke-width="1.5"/>
  </g>
  <circle cx="58" cy="866" r="10" fill="#355f7f"/>
  <text x="80" y="872" class="legend" font-size="18">Fluxo principal</text>
  <rect x="238" y="856" width="22" height="20" rx="6" fill="#dce7bb"/>
  <text x="274" y="872" class="legend" font-size="18">Artefatos executivos e contexto</text>
  <circle cx="558" cy="866" r="10" fill="#b98927"/>
  <text x="580" y="872" class="legend" font-size="18">Ciclo de feedback e entrega para OXE</text>
</svg>
